                  - listitem [ref=f11e363]:
                    - generic [ref=f11e366]: Gleicher Leistungsumfang und gleicher Standard an jedem Standort
            - generic [ref=f11e367]:
              - paragraph [ref=f11e368]: Die Verantwortung bleibt bei uns.
              - paragraph [ref=f11e369]: "Wer zusätzlich vor Ort ist, ändert nichts an Ihrer Ansprechperson und nichts an der Abnahme: Das Ergebnis kontrollieren wir gemeinsam mit der Bauleitung, und dafür stehen wir ein. Auf Wunsch nennen wir vorab, welche Betriebe auf Ihrem Objekt eingesetzt werden."

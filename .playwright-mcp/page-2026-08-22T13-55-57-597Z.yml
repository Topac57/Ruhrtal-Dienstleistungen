                  - heading "Angebot" [level=3] [ref=f11e244]
                  - paragraph [ref=f11e245]: Festpreis pro Einsatz oder Pauschale für den Turnus, in der Regel innerhalb von 24 Stunden.
              - listitem [ref=f11e246]:

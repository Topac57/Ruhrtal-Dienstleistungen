                - generic [ref=f11e253]:
                  - heading "Abnahme" [level=3] [ref=f11e254]
                  - paragraph [ref=f11e255]: Kontrolle vor Ort mit der Bauleitung, Fotodokumentation auf Wunsch.
          - article [ref=f11e256]:
            - generic [ref=f11e257]:
              - generic [ref=f11e258]: "06"
              - heading "Warum RD Baustellenservice" [level=2] [ref=f11e259]
            - paragraph [ref=f11e260]: Bauunternehmen, Generalunternehmer, Projektleitungen und Containervermieter arbeiten mit uns, weil die Abstimmung kurz und das Ergebnis überprüfbar ist.
            - generic [ref=f11e261]:
              - generic [ref=f11e268]:
                - heading "Zuverlässige Einsatzplanung" [level=3] [ref=f11e269]
                - paragraph [ref=f11e270]: Zugesagte Zeitfenster gelten. Änderungen im Bauablauf stimmen wir vorher ab, nicht danach.
              - generic [ref=f11e278]:
                - heading "Reinigung im festen Intervall" [level=3] [ref=f11e279]
                - paragraph [ref=f11e280]: Täglich, wöchentlich oder monatlich – abgestimmt auf Belegung und Bauphase.
              - generic [ref=f11e286]:
                - heading "Flexibel bei laufenden Baustellen" [level=3] [ref=f11e287]
                - paragraph [ref=f11e288]: Wir arbeiten parallel zum Baubetrieb, ohne die anderen Gewerke aufzuhalten.
              - generic [ref=f11e293]:
                - heading "Feste Ansprechpartner" [level=3] [ref=f11e294]
                - paragraph [ref=f11e295]: Eine Nummer vom Angebot bis zur Abnahme – ohne Warteschleife und ohne Weiterreichen.
              - generic [ref=f11e303]:
                - heading "Professionelles Auftreten" [level=3] [ref=f11e304]
                - paragraph [ref=f11e305]: Eingewiesenes Personal, eigene Geräte, Arbeitskleidung und Anmeldung auf der Baustelle.
              - generic [ref=f11e311]:
                - heading "Einsatz im Raum NRW" [level=3] [ref=f11e312]
                - paragraph [ref=f11e313]: Von Mülheim und Essen aus im gesamten Ruhrgebiet und Rheinland.
              - generic [ref=f11e320]:
                - heading "Lösungen für große Projekte" [level=3] [ref=f11e321]
                - paragraph [ref=f11e322]: Mehrere Standorte, hohe Containerzahlen und Sonderintervalle nach Absprache.
          - article [ref=f11e323]:
            - generic [ref=f11e324]:

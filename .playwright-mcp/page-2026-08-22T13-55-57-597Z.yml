              - heading "Ausgewählte Partnerbetriebe" [level=2] [ref=f11e326]
            - paragraph [ref=f11e327]: Bei großen Objekten, mehreren Standorten und engen Terminen arbeiten wir mit einem festen Kreis ausgewählter Unternehmen zusammen – dieselben Betriebe über Jahre, nicht wechselnde Anbieter von Auftrag zu Auftrag. Eingewiesen werden sie von uns, gearbeitet wird nach unseren Vorgaben.
